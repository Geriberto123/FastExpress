name: Calidad del backend

on:
  push:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'Backend/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calidad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Obtener código
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configurar Node.js 24
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - name: Instalar desde lockfile
        run: npm ci
      - name: Revisar estilo y reglas estáticas
        run: npm run lint
      - name: Verificar tipos de aplicación y pruebas
        run: npm run typecheck
      - name: Compilar
        run: npm run build
      - name: Ejecutar pruebas y umbrales de cobertura
        run: npm run test:cov
      - name: Conservar reportes de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-backend
          path: Backend/coverage/
          if-no-files-found: warn
          retention-days: 14
